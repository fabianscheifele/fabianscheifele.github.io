<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 566">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0%" stop-color="#0b3d1f"/>
      <stop offset="55%" stop-color="#0d5430"/>
      <stop offset="100%" stop-color="#0a4525"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#1d8a4a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b3d1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#156e35" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0a4525" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="566" fill="url(#bg)"/>
  <rect width="400" height="566" fill="url(#glow1)"/>
  <rect width="400" height="566" fill="url(#glow2)"/>

  <!-- Concentric circles (globe / innovation motif) centered at (310,155) -->
  <circle cx="310" cy="155" r="130" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="1.5"/>
  <circle cx="310" cy="155" r="100" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="1.2"/>
  <circle cx="310" cy="155" r="72"  fill="none" stroke="rgba(255,255,255,.055)" stroke-width="1"/>
  <circle cx="310" cy="155" r="46"  fill="none" stroke="rgba(255,255,255,.065)" stroke-width="1"/>
  <circle cx="310" cy="155" r="22"  fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.14)" stroke-width="1.1"/>

  <!-- Inner node network (green accent — tech/innovation) -->
  <circle cx="310" cy="109" r="4.5" fill="rgba(93,216,126,.62)"/>
  <circle cx="356" cy="178" r="3.5" fill="rgba(93,216,126,.52)"/>
  <circle cx="287" cy="197" r="4"   fill="rgba(93,216,126,.56)"/>
  <circle cx="264" cy="155" r="3.5" fill="rgba(93,216,126,.48)"/>
  <circle cx="310" cy="155" r="6"   fill="rgba(93,216,126,.72)"/>

  <line x1="310" y1="109" x2="356" y2="178" stroke="rgba(93,216,126,.24)" stroke-width="1"/>
  <line x1="356" y1="178" x2="287" y2="197" stroke="rgba(93,216,126,.22)" stroke-width="1"/>
  <line x1="287" y1="197" x2="264" y2="155" stroke="rgba(93,216,126,.22)" stroke-width="1"/>
  <line x1="264" y1="155" x2="310" y2="109" stroke="rgba(93,216,126,.22)" stroke-width="1"/>
  <line x1="310" y1="155" x2="310" y2="109" stroke="rgba(93,216,126,.17)" stroke-width="1"/>
  <line x1="310" y1="155" x2="356" y2="178" stroke="rgba(93,216,126,.17)" stroke-width="1"/>
  <line x1="310" y1="155" x2="264" y2="155" stroke="rgba(93,216,126,.17)" stroke-width="1"/>
  <line x1="310" y1="155" x2="287" y2="197" stroke="rgba(93,216,126,.17)" stroke-width="1"/>

  <!-- Outer ring nodes (white, subtler) -->
  <circle cx="310" cy="55"  r="3.5" fill="rgba(255,255,255,.28)"/>
  <circle cx="398" cy="118" r="3"   fill="rgba(255,255,255,.24)"/>
  <circle cx="398" cy="200" r="3.5" fill="rgba(255,255,255,.28)"/>
  <circle cx="338" cy="255" r="3"   fill="rgba(255,255,255,.24)"/>
  <circle cx="228" cy="222" r="3.5" fill="rgba(255,255,255,.26)"/>
  <circle cx="202" cy="130" r="3"   fill="rgba(255,255,255,.22)"/>
  <circle cx="242" cy="68"  r="3.5" fill="rgba(255,255,255,.24)"/>

  <line x1="310" y1="55"  x2="310" y2="109" stroke="rgba(255,255,255,.09)" stroke-width="1"/>
  <line x1="310" y1="55"  x2="242" y2="68"  stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <line x1="242" y1="68"  x2="202" y2="130" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <line x1="202" y1="130" x2="264" y2="155" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="228" y1="222" x2="264" y2="155" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="338" y1="255" x2="287" y2="197" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="398" y1="200" x2="356" y2="178" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="398" y1="118" x2="356" y2="178" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- Subtle leaf shapes — lower left and right -->
  <path d="M 0 478 Q 45 425 85 488 Q 42 448 0 478 Z"   fill="rgba(93,216,126,.065)"/>
  <path d="M 0 512 Q 55 452 105 514 Q 52 472 0 512 Z"  fill="rgba(93,216,126,.05)"/>
  <path d="M 328 500 Q 370 450 400 502 Q 368 466 328 500 Z" fill="rgba(93,216,126,.055)"/>
  <path d="M 318 532 Q 365 482 400 534 Q 362 500 318 532 Z" fill="rgba(93,216,126,.045)"/>

  <!-- IFC logo (top left) -->
  <rect x="16" y="12" width="52" height="24" rx="3" fill="#f7941d"/>
  <text x="42" y="28" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900"
        fill="white" letter-spacing="1.5">IFC</text>

  <!-- "A member of the World Bank Group" -->
  <text x="76" y="20" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="rgba(255,255,255,.62)">A member of the</text>
  <text x="76" y="30" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="rgba(255,255,255,.62)">World Bank Group</text>

  <!-- Thin header separator -->
  <line x1="16" y1="50" x2="384" y2="50" stroke="rgba(255,255,255,.07)" stroke-width=".5"/>

  <!-- Title block -->
  <text x="24" y="305"
        font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="300"
        fill="rgba(255,255,255,.88)" letter-spacing=".4">Innovation in</text>

  <text x="24" y="360"
        font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="900"
        fill="#5dd87e" letter-spacing="1">Green</text>

  <text x="24" y="408"
        font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"
        fill="rgba(255,255,255,.92)" letter-spacing=".3">Technologies</text>

  <!-- Orange accent bar -->
  <rect x="24" y="422" width="48" height="3" rx="1.5" fill="#f7941d" opacity=".82"/>

  <!-- Subtitle -->
  <text x="24" y="446" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="rgba(255,255,255,.68)">An opportunity for businesses in</text>
  <text x="24" y="462" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="rgba(255,255,255,.68)">low and middle income countries?</text>

  <!-- Year -->
  <text x="24" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="rgba(255,255,255,.42)" letter-spacing=".5">2025</text>

  <!-- Bottom separator -->
  <line x1="16" y1="510" x2="384" y2="510" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>

  <!-- WB Group globe mark -->
  <circle cx="24" cy="538" r="9.5" fill="none" stroke="rgba(255,255,255,.48)" stroke-width="1.2"/>
  <ellipse cx="24" cy="538" rx="4.5" ry="9.5" fill="none" stroke="rgba(255,255,255,.48)" stroke-width=".7"/>
  <line x1="14.5" y1="538" x2="33.5" y2="538" stroke="rgba(255,255,255,.48)" stroke-width=".7"/>
  <text x="38" y="542" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="600"
        fill="rgba(255,255,255,.58)" letter-spacing="1.2">WORLD BANK GROUP</text>
</svg>
